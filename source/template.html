<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mani temple</title>
<meta name="description" content="Turn the prayer wheel, read the teaching and watch H.E. Garchen Rinpoche's Chenrezig empowerment, in a Tibetan temple in your browser.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ryanallen.com/chenrezig/">
<meta property="og:title" content="Chenrezig">
<meta property="og:description" content="Turn the prayer wheel, read the teaching and watch H.E. Garchen Rinpoche's Chenrezig empowerment, in a Tibetan temple in your browser.">
<meta property="og:image" content="https://ryanallen.com/chenrezig/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A great red and gold prayer wheel in a painted Tibetan temple, clouds drifting under the ceiling">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ryanallen.com/chenrezig/share.jpg">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:Georgia,serif;color:#e8d6b8}
canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity 2s,filter .5s}
body.r canvas{opacity:1}
body.ui canvas{filter:brightness(.35) blur(3px)}
body.menu-on canvas{filter:brightness(.55) blur(6px)}
#s{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;letter-spacing:2px;pointer-events:none}
body.e #s{color:#f0a080;padding:2em;text-align:center}
#v,#h{position:absolute;left:0;right:0;bottom:4vh;text-align:center;font-size:15px;letter-spacing:3px;opacity:0;transition:opacity .8s;pointer-events:none;text-shadow:0 0 8px #000}
#h{bottom:auto;top:calc(50% + 22px);letter-spacing:1px;transition:opacity .6s}
#d{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#f4e6cc;box-shadow:0 0 3px #000;opacity:0;pointer-events:none}
body.ui #h,body.ui #d,body.menu-on #h,body.menu-on #d{display:none}

.veil{position:fixed;inset:0;display:none;align-items:center;justify-content:center;touch-action:none;user-select:none}
body.ui .veil{display:flex}
.veil .x{position:absolute;top:14px;right:18px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(20,12,6,.55);color:#f0e0c4;font:30px/44px Georgia,serif;cursor:pointer;z-index:3}
.veil .tip{position:absolute;bottom:2.5vh;left:0;right:0;text-align:center;font-size:14px;letter-spacing:1px;opacity:.75;pointer-events:none}
.pecha,.phone{display:none}
body.hold-pecha .pecha,body.hold-phone .phone{display:block}

.stack{position:relative;perspective:2400px;cursor:pointer}
.leaf{position:absolute;inset:0;color:#1c120a;transform-origin:50% 0;transition:transform .42s cubic-bezier(.4,.1,.3,1),opacity .42s;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.42}
.leaf.up{transform:rotateX(-110deg) translateZ(1px);opacity:0}
.leaf .paper{position:absolute;left:0;top:0;width:100%;height:100%;background:center/100% 100% no-repeat;filter:drop-shadow(0 16px 26px rgba(0,0,0,.6))}
.leaf .body,.leaf .margin{position:absolute;overflow:hidden}
.leaf .body{mix-blend-mode:multiply;text-shadow:0 0 .6px rgba(28,18,10,.7)}
.leaf h2{margin:0 0 .35em;font-size:1.06em;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8e1d0e}
.leaf p{margin:0 0 .45em;text-align:justify;hyphens:auto}
.leaf p.q{color:#7a1a0c;font-style:italic;padding:0 1.2em}
.leaf p.li,.leaf p.ol{padding-left:1.2em;text-indent:-1em}
.leaf p.mantra{font-family:"Microsoft Himalaya","Noto Serif Tibetan",Jomolhari,Kailasa,serif;font-size:2.6em;line-height:1.1;text-align:center;color:#8e1d0e;margin:.2em 0 0}
.leaf p.mantra-en{text-align:center;letter-spacing:.35em;font-size:.85em;color:#8e1d0e}
.leaf .margin{display:flex;flex-direction:column;gap:.6em;align-items:center;justify-content:center;mix-blend-mode:multiply;color:#5a2010;font-size:.68em;letter-spacing:.06em;text-align:center}
.leaf .margin span{writing-mode:vertical-rl;transform:rotate(180deg);max-height:100%}
.leaf .margin b{font-family:"Microsoft Himalaya","Noto Serif Tibetan",Jomolhari,serif;font-size:2.6em;line-height:1;font-weight:400;display:block;color:#8e1d0e}
.leaf .title{display:flex;align-items:center;justify-content:space-between;gap:4%;mix-blend-mode:normal;text-shadow:none}
.leaf .mini{flex:none;object-fit:cover;border:3px solid #8e1d0e;outline:1px solid #8e1d0e;outline-offset:3px;background:#5a2a18}
.leaf .tt{flex:1;text-align:center;mix-blend-mode:multiply}
.leaf .tt h1{margin:.1em 0;font-size:2.1em;font-weight:500;letter-spacing:.06em;color:#8e1d0e}
.leaf .tt .tib{margin:0;font-family:"Microsoft Himalaya","Noto Serif Tibetan",Jomolhari,serif;font-size:2.4em;line-height:1;text-align:center}
.leaf .tt .by{text-align:center;font-size:.95em}
.leaf.meas{visibility:hidden;position:absolute;left:-9999px;top:0;inset:auto;height:auto;box-shadow:none;transform:none}

.phone .body{position:relative;width:min(46vh,92vw);height:min(92vh,199vw);border-radius:min(6vh,12vw);background:#0b0b0d;box-shadow:0 0 0 2px #2a2a30,0 24px 70px rgba(0,0,0,.7);padding:min(1.4vh,2.8vw);box-sizing:border-box}
.phone .scr{width:100%;height:100%;border-radius:min(4.8vh,9.6vw);overflow:hidden;background:#0f0f10;display:flex;flex-direction:column;font-family:system-ui,sans-serif;color:#eee;touch-action:pan-y}
.phone .player{position:relative;margin-top:min(5vh,10vw);aspect-ratio:16/9;background:#000;flex:none}
.phone .player img{width:100%;height:100%;object-fit:cover;opacity:.55}
.phone .player .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.5px}
.phone .player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.phone .list{padding:10px 8px;overflow:auto}
.phone .item{display:flex;gap:10px;width:100%;padding:8px;border:0;border-radius:10px;background:none;color:inherit;text-align:left;font:inherit;cursor:pointer;align-items:center}
.phone .item:hover,.phone .item.on{background:#26262a}
.phone .item img,.phone .item .ph{width:42%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;flex:none;background:#333}
.phone .item b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.phone .item small{display:block;margin-top:4px;font-size:12px;color:#aaa}
.phone .note{margin:auto 14px 18px;font-size:12px;line-height:1.45;color:#aaa}
.phone .note a{color:#8cb4ff}
@media (max-width:600px){.phone .body{width:100vw;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}.phone .scr{border-radius:0}.phone .player{margin-top:66px}}

.menu{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;touch-action:pan-y}
body.menu-on .menu{display:flex}
.menu .card{width:min(1180px,94vw);max-height:92vh;overflow:auto;box-sizing:border-box;padding:34px 40px 30px;background:rgba(22,14,8,.82);border:1px solid rgba(200,160,90,.35);border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.7);line-height:1.55;font-size:15.5px;scrollbar-width:thin}
.menu .tib{margin:0;text-align:center;font-family:"Microsoft Himalaya","Noto Serif Tibetan",Jomolhari,serif;font-size:42px;line-height:1;color:#e0b35a}
.menu h1{margin:4px 0 14px;text-align:center;font-weight:400;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#f0dcb4}
.menu h3{margin:20px 0 6px;font-weight:400;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:#d8a24c}
.menu p{margin:0 0 8px;color:#e8d6b8}
.menu .links{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.menu a{color:#f0c878}
.menu .back{display:block;margin:18px auto 0;padding:11px 30px;border:1px solid #d8a24c;border-radius:3px;background:#8e1d0e;color:#fbe9c8;font:16px Georgia,serif;letter-spacing:.12em;cursor:pointer}
.menu .back:hover{background:#a8260f}
@media (max-width:600px){.menu .card{padding:24px 20px;font-size:14.5px}}
.menu .load{margin:4px 0 6px;padding:12px 14px;border:1px solid rgba(200,160,90,.25);border-radius:4px;background:rgba(0,0,0,.25)}
.menu .load.done ul{display:none}
.bar{height:4px;border-radius:2px;background:rgba(255,230,190,.14);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862e,#f0c878);transition:width .3s}
.menu .load p{margin:8px 0 6px;font-size:13px;color:#d8c4a0}
.menu .load ul{list-style:none;margin:0;padding:0;max-height:132px;overflow:auto;font-size:12.5px;scrollbar-width:thin}
.menu .load li{display:flex;justify-content:space-between;gap:10px;padding:1px 0;color:#8a7a62}
.menu .load li.s-load{color:#f0dcb4}
.menu .load li.s-done{color:#c8b28a}
.menu .load li.s-quick{color:#a8977a}
.menu .load li small{flex:none;font-size:12px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:0 0 10px;display:none;pointer-events:none;text-align:center}
body.loading:not(.menu-on):not(.ui) .foot{display:block}
.foot .bar{height:3px;border-radius:0;margin-bottom:8px}
.foot p{margin:0;font-size:12.5px;letter-spacing:.5px;color:#e8d6b8;text-shadow:0 0 6px #000}
#jb,#jk{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s;z-index:2}
#jb{width:112px;height:112px;border:2px solid rgba(240,220,180,.45);background:rgba(20,12,6,.25)}
#jk{width:48px;height:48px;background:rgba(240,220,180,.55);box-shadow:0 0 8px rgba(0,0,0,.5)}
body.ui #jb,body.ui #jk,body.menu-on #jb,body.menu-on #jk{display:none}
.menu .cols{columns:2 400px;column-gap:44px}
.menu .cols h3{break-after:avoid}
.menu .cols>h3:first-child{margin-top:0}
.menu .cols section{break-inside:avoid}
.menu .cols section:first-child h3{margin-top:0}
.menu .back{margin:14px auto 6px}
.menu .back:disabled{background:#3a2a1c;border-color:#6a5030;color:#b8a688;cursor:wait}
.menu .ctl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;align-items:center;font-size:14px;color:#d8c4a0;margin-bottom:4px}
.menu .ctl .how{display:flex;gap:4px;align-items:center;justify-content:flex-end;color:#e0b35a}
.menu .ctl svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.menu kbd{display:inline-block;min-width:22px;padding:2px 6px;border:1px solid #8a6a3a;border-bottom-width:3px;border-radius:4px;background:#2a1c12;color:#f0dcb4;font:600 12px/18px system-ui,sans-serif;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="s">Opening the door</div>
<div id="v"></div>
<div id="d"></div>
<div id="h"></div>
<script>/*SCRIPT*/</script>
</body>
</html>
